<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <!-- BendlessTech Logo - Dark Version -->
  <defs>
    <linearGradient id="gradient-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9ff5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a73e8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon/Symbol -->
  <g id="logo-icon-dark">
    <rect x="10" y="20" width="40" height="40" rx="8" fill="url(#gradient-dark)"/>
    <path d="M 20 40 L 30 30 L 40 40 L 30 50 Z" fill="white" opacity="0.95"/>
    <circle cx="30" cy="40" r="3" fill="#f57c00"/>
  </g>
  
  <!-- Text -->
  <text x="60" y="48" font-family="'Inter', 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="white">
    Bendless
  </text>
  <text x="185" y="48" font-family="'Inter', 'Segoe UI', sans-serif" font-size="28" font-weight="400" fill="#e0e0e0">
    Tech
  </text>
  <text x="60" y="62" font-family="'Inter', 'Segoe UI', sans-serif" font-size="10" font-weight="400" fill="#b0b0b0" letter-spacing="2">
    TECHNOLOGY THAT ADAPTS
  </text>
</svg>
